<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8">
  </head>

<body>
  <form>
    <p><span data-i18n="currentFilenameFormat"></span>: <b id="filename-format"><span data-i18n="loading"></span></b></p>
    <label data-i18n="newFilenameFormat"></label>:
    <input type="text" id="new-filename-format" style="margin: 2px; width:500px;" ><br>
    <p><span data-i18n="willOpenInNewTab"></span>: <b id="open-in-new-tab"></b></p>
    <input type="checkbox" id="new-open-in-new-tab" name="new-open-in-new-tab">
    <label for="new-open-in-new-tab" data-i18n="openInNewTab"></label><br>
    <p><span data-i18n="usingPdfRedirection"></span>: <b id="redirect-pdf"></b></p>
    <input type="checkbox" id="new-redirect-pdf" name="new-redirect-pdf">
    <label for="new-redirect-pdf" data-i18n="enablePdfRedirection"></label><br><br>
    <button id="update" type="submit" data-i18n="update"></button>
    <button id="revert" type="submit" data-i18n="revertToDefault"></button><br>
    <p data-i18n="filenameFormatNote"></p>
    <p data-i18n="pdfRedirectionNote"></p>
  </form>
  <b data-i18n="experimentalFeatures"></b>:
  <form>
    <p><span data-i18n="currentPdfViewerUrlPrefix"></span>: <b id="pdf-viewer-url-prefix"></b></p>
    <label data-i18n="newPdfViewerUrlPrefix"></label>:
    <input type="text" id="new-pdf-viewer-url-prefix" style="margin: 2px; width:400px;" value="https://mozilla.github.io/pdf.js/web/viewer.html?file="><br>
    <button id="update-pdf-viewer-url-prefix" type="submit" data-i18n="update"></button>
    <button id="revert-pdf-viewer-url-prefix" type="submit" data-i18n="revertToDefault"></button><br>
    <p data-i18n="externalPdfViewerNote"></p>
  </form>
  <form>
    <p><span data-i18n="currentPdfViewerDefaultZoom"></span>: <b id="pdf-viewer-default-zoom"></b></p>
    <label data-i18n="newPdfViewerDefaultZoom"></label>:
    <select id="new-pdf-viewer-default-zoom" style="margin: 2px;">
      <option value="auto" data-i18n="zoomAuto"></option>
      <option value="page-fit" data-i18n="zoomPageFit"></option>
      <option value="page-width" data-i18n="zoomPageWidth"></option>
      <option value="50">50%</option>
      <option value="75">75%</option>
      <option value="100">100%</option>
      <option value="125">125%</option>
      <option value="150">150%</option>
      <option value="200">200%</option>
      <option value="300">300%</option>
      <option value="400">400%</option>
      <option value="custom" data-i18n="zoomCustom"></option>
    </select><br>
    <div id="custom-zoom-container" style="display: none; margin-top: 5px;">
      <label data-i18n="customZoom"></label> (%):
      <input type="number" id="custom-pdf-viewer-zoom" style="margin: 2px; width: 80px;" min="10" max="500" step="5">%
    </div>
    <button id="update-pdf-viewer-default-zoom" type="submit" data-i18n="update"></button>
    <button id="revert-pdf-viewer-default-zoom" type="submit" data-i18n="revertToDefault"></button><br>
    <p data-i18n="pdfViewerZoomNote"></p>
  </form>
  <a href="https://github.com/j3soon/arxiv-utils#options" data-i18n="help"></a>
  <script src="options.js"></script>
</body>

</html>
