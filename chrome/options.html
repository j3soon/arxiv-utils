<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8">
    <title data-i18n="optionsTitle"></title>
  </head>

<body>
  <h1 data-i18n="optionsTitle"></h1>
  <form>
    <p><span data-i18n="currentFilenameFormat"></span>: <b id="filename-format"><span data-i18n="loading"></span></b></p>
    <label data-i18n="newFilenameFormat"></label>:
    <input type="text" id="new-filename-format" style="margin: 2px; width:500px;" ><br>
    <p><span data-i18n="currentFilenameReplacementRules"></span>:</p>
    <pre id="filename-replacement-rules" data-i18n="loading"></pre>
    <label data-i18n="newFilenameReplacementRules"></label>:<br>
    <textarea id="new-filename-replacement-rules" maxlength="8192" style="margin: 2px; width:500px; height:180px;" ></textarea><br>
    <p><span data-i18n="willAskWhereToSavePdf"></span>: <b id="download-save-as"></b></p>
    <input type="checkbox" id="new-download-save-as" name="new-download-save-as">
    <label for="new-download-save-as" data-i18n="askWhereToSavePdf"></label><br>
    <p><span data-i18n="willOpenInNewTab"></span>: <b id="open-in-new-tab"></b></p>
    <input type="checkbox" id="new-open-in-new-tab" name="new-open-in-new-tab">
    <label for="new-open-in-new-tab" data-i18n="openInNewTab"></label><br>
    <br>
    <button id="update" type="submit" data-i18n="update"></button>
    <button id="revert" type="submit" data-i18n="revertToDefault"></button><br>
    <p data-i18n="filenameFormatNote"></p>
    <p data-i18n="filenameSafetyNote"></p>
  </form>
  <a href="https://github.com/j3soon/arxiv-utils#options" data-i18n="help"></a>
  <script src="options.js"></script>
</body>

</html>
